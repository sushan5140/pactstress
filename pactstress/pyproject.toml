[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pactstress"
version = "0.1.0"
description = "Personalized Adaptive Calibration for sTress detection (PACT) from wearable physiological signals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = ["stress detection", "wearable sensors", "WESAD", "HRV", "physiological signal processing", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
signals = ["neurokit2>=0.2.0"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/yourusername/pactstress"

[tool.setuptools.packages.find]
where = ["src"]
